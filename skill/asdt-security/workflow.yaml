specialist: security
routable: true
steps:
  - name: knowledge-recall
    skill: ../asdt-shared/skills/knowledge-recall.md
    description: Query organizational memory for prior security findings, threat models, and mitigations relevant to this change before acting
    execution: inline

  - name: platform-analysis
    skill: ../asdt-core/references/platform-context.md
    description: Load and inject platform conventions and architectural fingerprint from knowledge.yaml
    execution: inline

  - name: assess
    skill: steps/assess.md
    description: Map the attack surface, apply STRIDE over it, and cross-check the surviving threats against the applicable OWASP Top 10 categories
    execution: subagent
    model: opus
    agent: analyst
    inputs:
      - "{project}/{change}/developer/handoff" # optional — the code that changed; Security runs at any point
      - "{project}/{change}/architect/handoff" # optional — the design and its trust boundaries
    output: context # retained in the orchestrator's context, injected into harden — never persisted
    reference_skills:
      - ../asdt-core/references/owasp.md

  - name: harden
    skill: steps/harden.md
    description: Turn the assessment into prioritized findings with concrete mitigations and an actionable hardening checklist
    execution: subagent
    model: sonnet
    agent: analyst
    inputs: []
    output_topic_key: "{project}/{change}/security/handoff"
    reference_skills:
      - ../asdt-core/protocol.md
