# DOCUMENTATION ONLY — This schema describes the expected structure of mem_save content.
# Artifacts are NOT written to the filesystem during specialist execution.
# Use mem_save with this structure as the content shape.
$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://github.com/vitualizz/asdt/schemas/hardening-checklist.schema.yaml"
title: HardeningChecklist
description: >
  Payload produced by the Security specialist's hardening-checklist step.
  Ordered action list for the Developer specialist to implement.
  Persisted via mem_save to the memory provider (not written to .asdt/artifacts/).
type: object

required:
  - summary

properties:
  quick_wins:
    type: array
    items:
      type: object
      properties:
        item:
          type: string
        priority:
          type: string
        finding_ref:
          type: string

  medium_effort:
    type: array
    items:
      type: object
      properties:
        item:
          type: string
        priority:
          type: string
        finding_ref:
          type: string

  significant:
    type: array
    items:
      type: object
      properties:
        item:
          type: string
        priority:
          type: string
        finding_ref:
          type: string

  must_fix_before_launch:
    type: array
    items:
      type: string

  can_defer:
    type: array
    items:
      type: string

  summary:
    type: string

  open_items:
    type: array
    items:
      type: string
