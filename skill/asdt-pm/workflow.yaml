specialist: pm
routable: true
steps:
  - name: knowledge-recall
    skill: ../asdt-core/references/knowledge-recall.md
    description: Query organizational memory for prior requirements, similar features, and scope decisions relevant to this change
    execution: inline

  - name: backlog
    skill: steps/backlog.md
    description: Turn the raw request into the requirements hand-off — user stories in delivery order, explicit scope, measurable NFRs, acceptance criteria
    execution: subagent
    model: sonnet
    agent: analyst
    inputs:
      - "{project}/{change}/researcher/handoff" # optional — prior discovery; degrade gracefully if absent
    output_topic_key: "{project}/{change}/pm/handoff"
    reference_skills:
      - ../asdt-core/references/scope-definition.md
      - ../asdt-core/protocol.md

  - name: review
    skill: steps/review.md
    description: Compare what exists against the requirements in force — unimplemented requirements, unrequested behavior, untestable criteria
    execution: subagent
    model: sonnet
    agent: analyst
    inputs: []
    output_topic_key: "{project}/study/{topic}/pm"
    reference_skills:
      - ../asdt-core/references/scope-definition.md
      - ../asdt-core/protocol.md
