specialist: ux-ui
routable: true
steps:
  - name: knowledge-recall
    skill: ../asdt-core/references/knowledge-recall.md
    description: Recall the project's notes on prior UX decisions and component patterns relevant to this change before acting
    execution: inline

  - name: platform-analysis
    skill: ../asdt-core/references/platform-context.md
    description: Inject the platform block — conventions, design fingerprint, and the design surface — from .asdt/config.yaml
    execution: inline

  # Under `Design surface: none` the orchestrator launches neither ux-spec nor ui-design: it
  # writes a minimal role summary itself (SKILL.md, "No visual surface").
  - name: ux-spec
    skill: steps/ux-spec.md
    description: Turn the requirement into user flows for the project's design surface — branches, states, and copy — mapped to existing components, with the accessibility each one owes
    execution: subagent
    model: sonnet
    agent: analyst
    inputs:
      - pm # optional — the requirement, its acceptance criteria, and its scope
    reference_skills:
      - ../asdt-core/references/accessibility.md
      - ../asdt-core/references/summary-schema.md

  - name: ui-design
    skill: steps/ui-design.md
    description: Design the UI the flows need — every screen's layout, hierarchy, typography, and states, every missing component's anatomy and states, and the visual foundation when there is no design system — in the one role summary
    execution: subagent
    model: opus
    agent: analyst
    inputs:
      - ux-ui/ux-spec
    output: summary
    reference_skills:
      - ../asdt-core/references/visual-design.md
      - ../asdt-core/references/accessibility.md
      - ../asdt-core/references/summary-schema.md
    host_skills:
      - frontend-design # raises the craft of the design when the host has it

  - name: review
    skill: steps/review.md
    description: Audit the flows that already ship — friction, missing states, design-system drift, and accessibility
    execution: subagent
    model: sonnet
    agent: analyst
    output: summary
    reference_skills:
      - ../asdt-core/references/accessibility.md
      - ../asdt-core/references/summary-schema.md
