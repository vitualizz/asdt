specialist: researcher
routable: true
steps:
  - name: knowledge-recall
    skill: ../asdt-shared/skills/knowledge-recall.md
    description: Query organizational memory for prior discovery, similar problem framings, and decisions relevant to this exploration
    execution: inline

  - name: discovery
    skill: steps/discovery.md
    description: Frame the problem, diverge into candidate directions, judge feasibility with evidence, and converge on one recommendation
    execution: subagent
    model: sonnet
    agent: analyst
    inputs: []
    output_topic_key: "{project}/{change}/researcher/handoff"
    reference_skills:
      - ../asdt-core/references/platform-context.md
      - ../asdt-core/protocol.md
