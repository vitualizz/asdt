specialist: pm
routable: true
steps:
  - name: knowledge-recall
    skill: ../asdt-core/references/knowledge-recall.md
    description: Recall the project's notes on prior requirements, similar features, and scope decisions relevant to this change
    execution: inline

  - name: platform-analysis
    skill: ../asdt-core/references/platform-context.md
    description: Inject the platform block — conventions and the design surface — from .asdt/config.yaml
    execution: inline

  - name: backlog
    skill: steps/backlog.md
    description: Turn the raw request into the requirements summary — user stories in delivery order, explicit scope, measurable NFRs, acceptance criteria
    execution: subagent
    model: sonnet
    agent: analyst
    inputs:
      - researcher # optional — the recommended direction and its rejected ones
    output: summary
    reference_skills:
      - ../asdt-core/references/scope-definition.md
      - ../asdt-core/references/summary-schema.md

  - name: review
    skill: steps/review.md
    description: Compare what exists against the requirements in force — unimplemented requirements, unrequested behavior, untestable criteria
    execution: subagent
    model: sonnet
    agent: analyst
    output: summary
    reference_skills:
      - ../asdt-core/references/scope-definition.md
      - ../asdt-core/references/summary-schema.md
