# DOCUMENTATION ONLY — This schema describes the expected structure of mem_save content.
# Artifacts are NOT written to the filesystem during specialist execution.
# Use mem_save with this structure as the content shape.
$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://github.com/vitualizz/asdt/schemas/architectural-decision.schema.yaml"
title: ArchitecturalDecision
description: >
  Payload produced by the Architect specialist's decision-record step.
  Persisted via mem_save to the memory provider (not written to .asdt/artifacts/).
type: object

required:
  - decision
  - alternatives_considered

properties:
  decision_title:
    type: string

  status:
    type: string
    enum:
      - accepted
      - proposed
      - superseded
      - deprecated

  context:
    type: string

  decision:
    type: string

  alternatives_considered:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
        reason_rejected:
          type: string

  consequences:
    type: object
    properties:
      positive:
        type: array
        items:
          type: string
      negative:
        type: array
        items:
          type: string
      technical_debt:
        type: array
        items:
          type: string

  key_constraints_for_developer:
    type: array
    items:
      type: string

  summary:
    type: string

  open_items:
    type: array
    items:
      type: string
