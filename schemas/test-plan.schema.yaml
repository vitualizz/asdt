# DOCUMENTATION ONLY — This schema describes the expected structure of mem_save content.
# Artifacts are NOT written to the filesystem during specialist execution.
# Use mem_save with this structure as the content shape.
$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://github.com/vitualizz/asdt/schemas/test-plan.schema.yaml"
title: TestPlan
description: >
  Payload produced by the QA specialist's quality-report step.
  Persisted via mem_save to the memory provider (not written to .asdt/artifacts/).
type: object

required:
  - quality_verdict

properties:
  test_summary:
    type: object
    properties:
      total_cases:
        type: integer
      unit:
        type: integer
      integration:
        type: integer
      e2e:
        type: integer

  ac_coverage:
    type: object
    properties:
      total_testable:
        type: integer
      covered:
        type: integer
      coverage_percent:
        type: string

  ac_gaps:
    type: array
    items:
      type: string

  quality_verdict:
    type: string
    enum: [READY, READY_WITH_CAVEATS, BLOCKED]

  verdict_rationale:
    type: string

  test_cases:
    type: array
    items:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        given:
          type: string
        when:
          type: string
        then:
          type: string
        type:
          type: string
          enum: [unit, integration, e2e, acceptance]
        story_id:
          type: string

  open_items:
    type: array
    items:
      type: string
