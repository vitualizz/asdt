specialist: architect
routable: true
steps:
  - name: knowledge-recall
    skill: ../asdt-core/references/knowledge-recall.md
    description: Recall the project's notes on prior architectural decisions relevant to this change before acting
    execution: inline

  - name: platform-analysis
    skill: ../asdt-core/references/platform-context.md
    description: Inject the platform block — conventions and design fingerprint — from .asdt/config.yaml
    execution: inline

  - name: design
    skill: steps/design.md
    description: Make the architectural decision, design the data model and API surface, and return the summary Developer, QA, and Security consume
    execution: subagent
    model: opus
    agent: analyst
    inputs:
      - pm # optional — the requirements this design satisfies
      - ux-ui # optional — the flows and components the design has to serve
      - security # optional — findings and checklist the design has to absorb
      - researcher # optional — the explored direction; frames the problem only when PM was skipped
    output: summary
    reference_skills:
      - ../asdt-core/references/api-design.md
      - ../asdt-core/references/scope-definition.md
      - ../asdt-core/protocol.md

  - name: review
    skill: steps/review.md
    description: Judge the architecture that already exists in an area — prioritized findings with evidence, not a design
    execution: subagent
    model: opus
    agent: analyst
    output: summary
    reference_skills:
      - ../asdt-core/references/api-design.md
      - ../asdt-core/protocol.md
