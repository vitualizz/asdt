specialist: developer
routable: true
steps:
  - name: knowledge-recall
    skill: ../asdt-core/references/knowledge-recall.md
    description: Recall the project's notes on prior decisions relevant to this change before acting
    execution: inline

  - name: platform-analysis
    skill: ../asdt-core/references/platform-context.md
    description: Inject the platform block — conventions and the design surface — from .asdt/config.yaml
    execution: inline

  - name: explore
    skill: steps/explore.md
    description: Explore the request and the affected area of the codebase before speccing
    execution: subagent
    model: sonnet
    agent: analyst

  - name: spec
    skill: steps/spec.md
    description: Define scope, acceptance criteria, the technical approach, and the files implement is allowed to touch
    execution: subagent
    model: sonnet
    agent: analyst
    inputs:
      - pm # optional — acceptance-criteria authority
      - architect # optional — the design decision, when Architect ran
      - ux-ui # optional — the flows, screen and component designs, and any visual direction, when UX/UI ran
      - security # optional — mitigations the change must carry, when Security ran
      - qa # optional — gaps and edge cases to close
      - developer # optional — the summary this plan replaces; any delivery it holds is carried forward
      - developer/explore # optional — absent when explore did not run this session
    output: summary
    reference_skills:
      - ../asdt-core/references/scope-definition.md
      - ../asdt-core/protocol.md

  - name: approve
    description: Show the human the spec's scope, acceptance criteria, and exact files, and get approve / adjust / stop before any host file is written
    execution: inline

  - name: implement
    skill: steps/implement.md
    description: Write the implementation and, under strict TDD, its tests — within the edit roots declared by the spec
    execution: subagent
    model: opus
    agent: builder
    inputs:
      - architect # optional — the design decision, when Architect ran
      - developer/spec
      - developer/verify # optional — only on a fix round launched by verify
    output: summary
    reference_skills:
      - ../asdt-core/references/conventions.md
      - ../asdt-core/protocol.md
    host_skills:
      - frontend-design # visual execution of UI files, when the host has it

  - name: verify
    description: Offer the summary's verification commands, run them only on the human's yes, record the outcome, and drive at most two fix rounds through implement
    execution: inline
    output: summary

  - name: review
    skill: steps/review.md
    description: Judge the quality of code that already exists — findings with a one-line fix each, never a write
    execution: subagent
    model: sonnet
    agent: analyst
    output: summary
    reference_skills:
      - ../asdt-core/references/conventions.md
      - ../asdt-core/protocol.md
