specialist: qa
routable: true
steps:
  - name: knowledge-recall
    skill: ../asdt-core/references/knowledge-recall.md
    description: Query organizational memory for prior quality findings, edge cases, and test decisions relevant to this change
    execution: inline

  - name: test-plan
    skill: steps/test-plan.md
    description: Find the gaps and edge cases the acceptance criteria missed, turn them into concrete test cases, and give a go/no-go verdict
    execution: subagent
    model: opus
    agent: analyst
    inputs:
      - "{project}/{change}/pm/handoff" # optional — acceptance criteria and NFR targets
      - "{project}/{change}/developer/handoff" # optional — the plan (stage: spec) or what was built (stage: implemented)
      - "{project}/{change}/architect/handoff" # optional — the design and its declared risks
      - "{project}/{change}/ux-ui/handoff" # optional — flow branches and empty/loading/error states become edge cases
      - "{project}/{change}/security/handoff" # optional — each mitigation needs a test that proves it holds
    output_topic_key: "{project}/{change}/qa/handoff"
    reference_skills:
      - ../asdt-core/references/testing.md
      - ../asdt-core/protocol.md

  - name: review
    skill: steps/review.md
    description: Audit the test suite that already exists for an area — coverage gaps, weak assertions, and a verdict on its health
    execution: subagent
    model: opus
    agent: analyst
    inputs: []
    output_topic_key: "{project}/study/{topic}/qa"
    reference_skills:
      - ../asdt-core/references/testing.md
      - ../asdt-core/protocol.md
