specialist: researcher
routable: true
steps:
  - name: knowledge-recall
    skill: ../asdt-core/references/knowledge-recall.md
    description: Recall the project's notes on prior discovery, similar problem framings, and decisions relevant to this exploration
    execution: inline

  - name: discovery
    skill: steps/discovery.md
    description: Frame the problem, diverge into candidate directions, judge feasibility with evidence, and converge on one recommendation
    execution: subagent
    model: sonnet
    agent: analyst
    output: summary
    reference_skills:
      - ../asdt-core/references/platform-context.md
      - ../asdt-core/references/summary-schema.md
