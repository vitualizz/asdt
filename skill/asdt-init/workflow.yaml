specialist: asdt-init
routable: false
steps:
  - name: memory-check
    description: Orchestrator checks its own tool list for the bound remember/recall tools and settles fresh vs recalibration; never stops the run
    execution: inline

  - name: explore
    skill: steps/explore.md
    description: Detects the stack, context fields, and design fingerprint with bounded probes, plus the questions to ask — never guesses
    execution: subagent
    model: sonnet
    agent: analyst
    reference_skills:
      - ../asdt-core/protocol.md

  - name: enrichment
    description: Surfaces up to 3 central, non-obvious symbols as skippable note questions via code intelligence; skipped without memory or an indexed project, never fails
    execution: inline

  - name: clarify
    description: Asks the questions, reviews the recalibration delta, previews the write, and takes the consent; produces the answers write applies
    execution: inline

  - name: write
    skill: steps/write.md
    description: Writes .asdt/config.yaml from the detection and the answers, preserving manual values
    execution: subagent
    model: sonnet
    agent: builder
    inputs:
      - asdt-init/explore
      - asdt-init/clarify
    output: summary
    reference_skills:
      - ../asdt-core/protocol.md
