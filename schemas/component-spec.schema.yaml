# DOCUMENTATION ONLY — This schema describes the expected structure of mem_save content.
# Artifacts are NOT written to the filesystem during specialist execution.
# Use mem_save with this structure as the content shape.
$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://github.com/vitualizz/asdt/schemas/component-spec.schema.yaml"
title: ComponentSpec
description: >
  Payload produced by the UX/UI specialist's ux-handoff step.
  Documents reused, extended, and new UI components.
  Persisted via mem_save to the memory provider (not written to .asdt/artifacts/).
type: object

required: []

properties:
  reused_components:
    type: array
    items:
      type: string

  extended_components:
    type: array
    items:
      type: string

  new_components:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
        purpose:
          type: string
        reason_existing_insufficient:
          type: string
        props:
          type: array
          items:
            type: string
        events:
          type: array
          items:
            type: string
        responsive_behavior:
          type: string
        design_tokens_ref:
          type: array
          items:
            type: string
        state_matrix:
          type: object
          properties:
            default:
              type: object
              properties:
                applicable:
                  type: boolean
                behavior:
                  type: string
            hover:
              type: object
              properties:
                applicable:
                  type: boolean
                behavior:
                  type: string
            focus:
              type: object
              properties:
                applicable:
                  type: boolean
                behavior:
                  type: string
            active:
              type: object
              properties:
                applicable:
                  type: boolean
                behavior:
                  type: string
            disabled:
              type: object
              properties:
                applicable:
                  type: boolean
                behavior:
                  type: string
            empty:
              type: object
              properties:
                applicable:
                  type: boolean
                behavior:
                  type: string
            loading:
              type: object
              properties:
                applicable:
                  type: boolean
                behavior:
                  type: string
            error:
              type: object
              properties:
                applicable:
                  type: boolean
                behavior:
                  type: string
            success:
              type: object
              properties:
                applicable:
                  type: boolean
                behavior:
                  type: string
        responsive:
          type: object
          properties:
            mobile:
              type: string
            tablet:
              type: string
            desktop:
              type: string
            touch_target_compliant:
              type: boolean

  critique_annotations:
    type: array
    items:
      type: object
      properties:
        target:
          type: string
        issue:
          type: string
        severity:
          type: string
          enum:
            - low
            - medium
            - high
        token_ref:
          type: string

  needs_review:
    type: boolean

  open_items:
    type: array
    items:
      type: string
