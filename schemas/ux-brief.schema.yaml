# DOCUMENTATION ONLY — This schema describes the expected structure of mem_save content.
# Artifacts are NOT written to the filesystem during specialist execution.
# Use mem_save with this structure as the content shape.
$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://github.com/vitualizz/asdt/schemas/ux-brief.schema.yaml"
title: UXBrief
description: >
  Payload produced by the UX/UI specialist's ux-handoff step.
  Persisted via mem_save to the memory provider (not written to .asdt/artifacts/).
type: object

required:
  - feature_summary
  - primary_actor
  - user_flows
  - information_architecture

properties:
  feature_summary:
    type: string

  primary_actor:
    type: string

  success_criteria:
    type: array
    items:
      type: string

  design_intent:
    type: object
    properties:
      tone:
        type: string
      principles:
        type: array
        items:
          type: string
      north_star:
        type: string

  jtbd:
    type: array
    items:
      type: string

  content_intent:
    type: object
    properties:
      copy_direction:
        type: string
      microcopy:
        type: array
        items:
          type: string
      empty_state:
        type: string
      error_state:
        type: string

  user_flows:
    type: array
    items:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        steps:
          type: array
          items:
            type: string
        decision_points:
          type: array
          items:
            type: string

  information_architecture:
    type: object
    properties:
      sections:
        type: array
        items:
          type: string
      navigation_path:
        type: string

  open_items:
    type: array
    items:
      type: string
