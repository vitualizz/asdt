# DOCUMENTATION ONLY — This schema describes the expected structure of mem_save content.
# Artifacts are NOT written to the filesystem during specialist execution.
# Use mem_save with this structure as the content shape.
$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://github.com/vitualizz/asdt/schemas/system-design.schema.yaml"
title: SystemDesign
description: >
  Payload produced by the Architect specialist's system-design step.
  Persisted via mem_save to the memory provider (not written to .asdt/artifacts/).
type: object

required:
  - data_model
  - api_surface

properties:
  data_model:
    type: array
    items:
      type: object
      properties:
        entity:
          type: string
        fields:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
              constraints:
                type: string
        relationships:
          type: array
          items:
            type: string

  api_surface:
    type: array
    items:
      type: object
      properties:
        operation:
          type: string
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE, SUBSCRIBE, PUBLISH]
        input:
          type: object
        success_response:
          type: object
        error_cases:
          type: array
          items:
            type: string

  service_boundaries:
    type: object
    properties:
      touched_modules:
        type: array
        items:
          type: string
      new_interfaces:
        type: array
        items:
          type: string
      extended_interfaces:
        type: array
        items:
          type: string

  key_sequence:
    type: array
    items:
      type: string

  open_items:
    type: array
    items:
      type: string
