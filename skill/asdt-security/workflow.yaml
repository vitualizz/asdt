specialist: security
routable: true
steps:
  - name: knowledge-recall
    skill: ../asdt-core/references/knowledge-recall.md
    description: Recall the project's notes on prior security findings, threat models, and mitigations relevant to this change before acting
    execution: inline

  - name: platform-analysis
    skill: ../asdt-core/references/platform-context.md
    description: Inject the platform block — conventions and architectural fingerprint — from .asdt/config.yaml
    execution: inline

  - name: assess
    skill: steps/assess.md
    description: Map the attack surface, apply STRIDE over it, and cross-check the surviving threats against the applicable OWASP Top 10 categories
    execution: subagent
    model: opus
    agent: analyst
    inputs:
      - developer # optional — the planned surface (Stage: spec) or the code that changed (Stage: implemented); Security runs at any point
      - architect # optional — the design and its trust boundaries
    reference_skills:
      - ../asdt-core/references/owasp.md
      - ../asdt-core/protocol.md

  - name: harden
    skill: steps/harden.md
    description: Turn the assessment into prioritized findings with concrete mitigations and an actionable hardening checklist
    execution: subagent
    model: sonnet
    agent: analyst
    inputs:
      - security/assess
    output: summary
    reference_skills:
      - ../asdt-core/protocol.md
