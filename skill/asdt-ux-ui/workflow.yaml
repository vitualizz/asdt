specialist: ux-ui
routable: true
steps:
  - name: knowledge-recall
    skill: ../asdt-core/references/knowledge-recall.md
    description: Query organizational memory for prior UX decisions and component patterns relevant to this change before acting
    execution: inline

  - name: platform-analysis
    skill: ../asdt-core/references/platform-context.md
    description: Load and inject the project's detected design system, conventions, and design fingerprint from knowledge.yaml, plus the design surface from config.yaml
    execution: inline

  # Under `Design surface: none` the orchestrator never launches ux-spec: it persists a minimal
  # ux-ui/handoff itself (SKILL.md, "No visual surface").
  - name: ux-spec
    skill: steps/ux-spec.md
    description: Turn the requirement into user flows for the project's design surface, mapped to existing design-system components — or, with no design system yet, a proposed visual direction — with the accessibility each one owes
    execution: subagent
    model: sonnet
    agent: analyst
    inputs:
      - "{project}/{change}/pm/handoff" # optional — the requirement and its acceptance criteria
    output_topic_key: "{project}/{change}/ux-ui/handoff"
    reference_skills:
      - ../asdt-core/references/accessibility.md
      - ../asdt-core/protocol.md
    host_skills:
      - frontend-design # raises the visual direction's quality when the host has it

  - name: review
    skill: steps/review.md
    description: Audit the flows that already ship — friction, missing states, design-system drift, and accessibility
    execution: subagent
    model: sonnet
    agent: analyst
    inputs: []
    output_topic_key: "{project}/study/{topic}/ux-ui"
    reference_skills:
      - ../asdt-core/references/accessibility.md
      - ../asdt-core/protocol.md
