specialist: architect
routable: true
steps:
  - name: knowledge-recall
    skill: ../asdt-shared/skills/knowledge-recall.md
    description: Query organizational memory for prior architectural decisions relevant to this change before acting
    execution: inline

  - name: platform-analysis
    skill: ../asdt-core/references/platform-context.md
    description: Load and inject platform conventions and design fingerprint from knowledge.yaml
    execution: inline

  - name: design
    skill: steps/design.md
    description: Make the architectural decision, design the data model and API surface, and emit the hand-off Developer and QA consume
    execution: subagent
    model: opus
    agent: analyst
    inputs:
      - "{project}/{change}/pm/handoff" # optional — the requirements this design satisfies; degrade gracefully if absent
    output_topic_key: "{project}/{change}/architect/handoff"
    reference_skills:
      - ../asdt-core/references/api-design.md
      - ../asdt-core/references/scope-definition.md
      - ../asdt-core/protocol.md
