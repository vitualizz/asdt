human_nuance:
  - topic: "installTransformPipeline"
    type: architectural
    note: "Source skills are never copied verbatim — the installer (writeSkillFile) transforms them at install time based on what the user configures in the TUI: workflow.yaml files get per-step model injection, and only the root SKILL.md regenerates its `Tailored Workflow Generation` region from the workflow.yaml files (per-specialist asdt-*/SKILL.md carry no markers, by design)."
    source: manual
    origin: user
  - topic: "evaluatorPurity"
    type: repo_practice
    note: "Every grader Evaluator is pure and never panics, even on malformed payloads — it returns errored(...) rather than crashing. Adding a probe type means an entry in the evaluators dispatch map plus the ProbeType constant."
    source: manual
    origin: user
  - topic: "workflowYamlSourceOfTruth"
    type: architectural
    note: "Each specialist's workflow.yaml is the source of truth walked by parallel generators — WorkflowModelSteps (model-selection map) and parseRegistry (the `skill/SKILL.md` `Tailored Workflow Generation` registry + drift test). Renaming or reordering a step is not local: it propagates to model selection, the generated `Tailored Workflow Generation` region, and the drift test at once."
    source: manual
    origin: user
# ASDT:NUANCE:END
