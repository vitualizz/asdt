specialist: qa
routable: true
steps:
  - name: knowledge-recall
    skill: ../asdt-core/references/knowledge-recall.md
    description: Recall the project's notes on prior quality findings, edge cases, and test decisions relevant to this change
    execution: inline

  - name: platform-analysis
    skill: ../asdt-core/references/platform-context.md
    description: Inject the platform block — conventions and the design surface — from .asdt/config.yaml
    execution: inline

  - name: test-plan
    skill: steps/test-plan.md
    description: Find the gaps and edge cases the acceptance criteria missed, turn them into concrete test cases, and give a go/no-go verdict
    execution: subagent
    model: opus
    agent: analyst
    inputs:
      - pm # optional — acceptance criteria and NFR targets
      - developer # optional — the plan (Stage: spec) or what was built (Stage: implemented)
      - architect # optional — the design and its declared risks
      - ux-ui # optional — flow branches and empty/loading/error states become edge cases
      - security # optional — each mitigation needs a test that proves it holds
    output: summary
    reference_skills:
      - ../asdt-core/references/testing.md
      - ../asdt-core/references/summary-schema.md

  - name: review
    skill: steps/review.md
    description: Audit the test suite that already exists for an area — coverage gaps, weak assertions, and a verdict on its health
    execution: subagent
    model: opus
    agent: analyst
    output: summary
    reference_skills:
      - ../asdt-core/references/testing.md
      - ../asdt-core/references/summary-schema.md
